<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Citizen Ready share image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 1fr 300px; align-items: center; gap: 48px;
    box-sizing: border-box; padding: 72px 80px;
    background: radial-gradient(circle at 85% 20%, rgba(176,135,64,0.35), transparent 380px), #1e3a5f;
    color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 800; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; background: #fff; }
  h1 { margin: 36px 0 0; font-size: 66px; line-height: 1.04; letter-spacing: -0.035em; }
  p { margin: 24px 0 0; color: rgba(255,255,255,0.82); font-size: 30px; }
  .pill { display: inline-block; margin-top: 30px; padding: 12px 22px; border-radius: 999px; background: #e3c58a; color: #1e3a5f; font-size: 26px; font-weight: 800; }
  .phone { width: 300px; border-radius: 34px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="/assets/icon.png" alt="">Citizen Ready</div>
    <h1>Free U.S. Citizenship Practice Test</h1>
    <p>All 128 official 2025 USCIS civics questions, in English and Spanish.</p>
    <span class="pill">Practice free · No sign-up</span>
  </div>
  <img class="phone" src="/assets/pass-citizenship-test.png" alt="">
</body>
</html>
