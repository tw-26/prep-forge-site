<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rankbound share image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 1fr 290px; align-items: center; gap: 56px;
    box-sizing: border-box; padding: 64px 90px 64px 80px;
    background:
      radial-gradient(circle at 82% 30%, rgba(65,230,245,0.28), transparent 360px),
      radial-gradient(circle at 0% 100%, rgba(14,143,176,0.25), transparent 420px),
      #050a14;
    color: #e8f1f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 28px; font-weight: 800; letter-spacing: 0.3em; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 0 30px rgba(65,230,245,0.35); }
  h1 { margin: 40px 0 0; font-size: 72px; line-height: 1.02; letter-spacing: -0.03em; }
  p { margin: 26px 0 0; color: #41e6f5; font-size: 24px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; }
  .phone { width: 290px; border: 1px solid rgba(65,230,245,0.3); border-radius: 36px; box-shadow: 0 0 0 6px rgba(13,24,42,0.9), 0 0 70px rgba(65,230,245,0.3); }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="../../assets/rankbound/icon.png" alt="">RANKBOUND</div>
    <h1>Turn Your Workouts Into an RPG.</h1>
    <p>Train &middot; Earn XP &middot; Rank Up</p>
  </div>
  <img class="phone" src="../../assets/rankbound/ss1.jpg" alt="">
</body>
</html>
